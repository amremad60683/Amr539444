# Codemagic: builds an UNSIGNED iOS .ipa on a cloud Mac.
# Install it on your iPhone from Windows with Sideloadly (it signs it with your free Apple ID).
workflows:
  ios-unsigned:
    name: iOS IPA for Sideloadly
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Run tests
        script: flutter test test
      - name: Build iOS app (no code signing)
        script: flutter build ios --release --no-codesign
      - name: Package .ipa
        script: |
          rm -rf Payload masrofy.ipa
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry masrofy.ipa Payload
    artifacts:
      - masrofy.ipa
